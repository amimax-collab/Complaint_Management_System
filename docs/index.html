<style>

</style></head><body>
<div id="bn">Preview: the real screens, running in your browser against sample data. The actual system uses the Node.js and MySQL backend.</div>
<header><b>Customer Complaint Management System</b><nav id="nav"></nav></header><main id="v"></main><div id="t" role="status"></div>
<script>
const $=s=>document.querySelector(s),v=$('#v'),nav=$('#nav'),H=36e5,now=()=>Date.now();

add(5,1,'Charged twice for one transaction','In Progress',3,60);add(5,4,'Unable to access my account','Resolved',4,30);add(6,2,'Service not delivered on the agreed date','Assigned',4,20);add(6,3,'Rude response from staff member','Submitted',null,5);add(5,5,'Equipment out of order for several days','In Progress',3,70);add(6,1,'Incorrect amount on my statement','Closed',3,200);add(5,2,'No reply to my earlier enquiry','Submitted',null,80,1);add(6,4,'Login keeps failing','Assigned',3,3);
const E=(s,m)=>Object.assign(new Error(m),{s}),P={customer:'submit own msg fb',officer:'assigned msg upd',supervisor:'assigned all msg upd assign reports jobs',admin:'users audit'};

'POST /complaints':({u,b})=>{ok(u,'submit');const k=CAT.find(x=>x.category_id===+b.category_id),s=(b.subject||'').trim(),t=(b.description||'').trim(),e=[];if(!k)e.push('choose a category');if(s.length<5)e.push('subject must be at least 5 characters');if(t.length<20)e.push('description must be at least 20 characters');if(e.length)throw E(400,e.join('; '));const n=now(),c={complaint_id:++seq,customer_id:u.id,category_id:k.category_id,category_name:k.category_name,assigned_officer_id:null,subject:s,description:t,priority:k.default_priority,status:'Submitted',is_escalated:0,submitted_at:n,due_at:n+k.resolution_hours*H,resolved_at:null,feedback:null};c.reference_no=ref(c);CS.push(c);note(c,null,'Status Change','Complaint submitted',1);log(u,'COMPLAINT_SUBMITTED',c);return{complaint_id:c.complaint_id,reference_no:c.reference_no,due_at:c.due_at}},
'GET /complaints/ref/:ref':({u,rf})=>{const c=CS.find(x=>x.reference_no===rf);if(!c||!mine(u,c))throw E(404,'Complaint not found');return det(u,c)},

'POST /complaints/:id/assign':({u,b,id})=>{ok(u,'assign');const c=find(u,id);if(['Resolved','Closed'].includes(c.status))throw E(409,'Complaint cannot be assigned');const o=b&&b.officer_id?+b.officer_id:load()[0].id;c.assigned_officer_id=o;if(c.status==='Submitted')c.status='Assigned';note(c,u,'Assignment','Assigned to '+U[o-1].name,0);log(u,'COMPLAINT_ASSIGNED',c);return det(u,c)},
'POST /complaints/:id/status':({u,b,id})=>{ok(u,'upd');const c=find(u,id),x=NEXT[c.status],n=(b.note||'').trim();if(b.status!==x)throw E(409,`Transition from ${c.status} to ${b.status} is not permitted`);if(x==='Closed'&&u.role!=='supervisor')throw E(403,'Only a supervisor can close a complaint manually');if(x==='Resolved'&&n.length<10)throw E(400,'A resolution note of at least 10 characters is required');c.status=x;if(x==='Resolved')c.resolved_at=now();note(c,u,x==='Resolved'?'Resolution':'Status Change',n||'Status changed to '+x,1);log(u,'STATUS_'+x.toUpperCase().replace(' ','_'),c);return det(u,c)},
'POST /complaints/:id/messages':({u,b,id})=>{ok(u,'msg');const c=find(u,id),m=(b.message||'').trim();if(c.status==='Closed')throw E(409,'The complaint is closed');if(m.length<2)throw E(400,'message is too short');const i=b.internal&&u.role!=='customer';note(c,u,u.role==='customer'?'Customer Message':i?'Note':'Officer Message',m,i?0:1);log(u,'MESSAGE_ADDED',c);return det(u,c)},
'POST /complaints/:id/feedback':({u,b,id})=>{ok(u,'fb');const c=find(u,id),r=+b.rating;if(c.status!=='Resolved')throw E(409,'Feedback can only be given for a resolved complaint');if(!(r>=1&&r<=5))throw E(400,'rating must be 1 to 5');c.feedback={rating:r,comment:(b.comment||'').trim()};c.status='Closed';log(u,'FEEDBACK_SUBMITTED',c);return det(u,c)},
'GET /officers':({u})=>{ok(u,'assign');return{officers:load(),suggested:load()[0]}},
'POST /jobs/escalate':({u})=>{ok(u,'jobs');let n=0;CS.forEach(c=>{if(!['Resolved','Closed'].includes(c.status)&&c.due_at<now()&&!c.is_escalated){c.is_escalated=1;n++;note(c,null,'Escalation','Complaint passed its due date',0);log(null,'COMPLAINT_ESCALATED',c)}});return{escalated:n}},
'GET /reports/summary':({u})=>{ok(u,'reports');const by={};CS.forEach(c=>{const r=by[c.category_name]=by[c.category_name]||{n:0,e:0,r:[]};r.n++;r.e+=c.is_escalated;if(c.resolved_at)r.r.push((c.resolved_at-c.submitted_at)/H)});return{status:Object.keys(NEXT).concat('Submitted').sort((a,b)=>['Submitted','Assigned','In Progress','Resolved','Closed'].indexOf(a)-['Submitted','Assigned','In Progress','Resolved','Closed'].indexOf(b)).map(s=>[s,CS.filter(c=>c.status===s).length]),cat:Object.entries(by).map(([k,r])=>[k,r.n,r.e,r.r.length?(r.r.reduce((a,b)=>a+b,0)/r.r.length).toFixed(1):'-'])}},
'GET /admin/users':({u})=>{ok(u,'users');return U},
'PATCH /admin/users/:id':({u,b,id})=>{ok(u,'users');if(+id===u.id)throw E(409,'You cannot deactivate your own account');const t=U.find(x=>x.id===+id);t.active=b.is_active?1:0;return t},
'GET /admin/audit':({u})=>{ok(u,'audit');return AU}};
const api=(m,url,b)=>new Promise((res,rej)=>{try{const[p,qs]=url.split('?'),s=p.split('/').filter(Boolean),rf=s[1]==='ref'?s[2]:null;if(rf)s[2]=':ref';const id=s.find(x=>/^\d+$/.test(x)),key=m+' /'+s.map(x=>/^\d+$/.test(x)?':id':x).join('/'),fn=R[key];if(!fn)throw E(404,'Not found');res(JSON.parse(JSON.stringify(fn({u:me&&U.find(x=>x.id===me.id),b:b||{},q:Object.fromEntries(new URLSearchParams(qs||'')),id,rf})||null)))}catch(e){rej(e)}});

function tabs(a){nav.replaceChildren();if(!me)return;T[me.role].forEach(([l,f])=>nav.append(h('button',{class:l===a?'on':'',onclick:()=>{tabs(l);f()}},l)));nav.append(h('span',{class:'mu'},me.name+' ('+me.role+')'),h('button',{onclick:()=>{me=null;vLogin()}},'Log out'))}
function vLogin(){tabs();v.replaceChildren(h('div',{class:'c'},h('h2',{},'Log in (preview)'),h('p',{class:'mu'},'The real system asks for an e-mail address and password. For this preview, choose a sample user.'),h('div',{class:'g'},U.map(u=>h('button',{onclick:()=>{me=u;tabs(T[u.role][0][0]);T[u.role][0][1]()}},u.name+' ('+u.role+')')))))}
function vNew(){const er=h('div'),out=h('div'),ct=h('select',{},CAT.map(k=>h('option',{value:k.category_id},`${k.category_name} (target ${k.resolution_hours} h)`))),sj=h('input'),ds=h('textarea');v.replaceChildren(h('div',{class:'c'},h('h2',{},'Submit a complaint'),er,fld('Category',ct),fld('Subject',sj),fld('Description',ds),h('p',{},h('button',{class:'p',onclick:()=>api('POST','/complaints',{category_id:ct.value,subject:sj.value,description:ds.value}).then(r=>{er.replaceChildren();out.replaceChildren(h('div',{class:'c'},h('b',{},'Complaint received. Your reference number is '+r.reference_no),h('p',{class:'mu'},'Target resolution date: '+d(r.due_at))));sj.value=ds.value=''},e=>er.replaceChildren(eb(e)))},'Submit')),out))}

const ld=async()=>{try{const r=await api('GET','/complaints?'+(sel.value?'status='+encodeURIComponent(sel.value)+'&':'')+(es.checked?'escalated=1':''));box.replaceChildren(r.length?tbl(['Reference','Subject','Status','Due',''],r.map(c=>[c.reference_no,c.subject,c.status,d(c.due_at),c.is_escalated?h('span',{class:'tg e'},'Escalated'):'']),i=>vDetail(r[i].complaint_id)):h('p',{class:'mu'},'No complaints found.'))}catch(e){box.replaceChildren(eb(e))}};
sel.onchange=es.onchange=ld;v.replaceChildren(h('div',{class:'c'},h('h2',{},title),h('div',{class:'g'},fld('Status',sel),sup?h('div',{},h('label',{},es,' Escalated only'),h('button',{onclick:()=>api('POST','/jobs/escalate').then(r=>{toast(r.escalated+' complaint(s) escalated by the scheduled job');ld()})},'Run escalation job now')):null),h('p'),box));ld()}

const st=me.role==='officer'||me.role==='supervisor',er=h('div'),rl=()=>vDetail(id),go=(p,b)=>api('POST','/complaints/'+id+p,b).then(rl,e=>er.replaceChildren(eb(e)));
